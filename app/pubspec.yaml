name: agentic_portal
description: Mobile chat interface for coding agents (Claude Code, Gemini, Codex, Aider)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management (Riverpod - best for streaming)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # SSE Streaming
  eventflux: ^1.7.1

  # Markdown with Streaming Support
  flutter_smooth_markdown: ^1.0.3

  # Code Syntax Highlighting
  flutter_code_view: ^1.0.5

  # HTTP Client
  dio: ^5.4.1

  # Local Network Discovery
  bonsoir: ^5.1.3
  mobile_scanner: ^5.1.1

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
